services:
  test:
    build:
      context: ../../..
      dockerfile: tests/integration/libsecret/Dockerfile
    environment:
      # we need this so the test actually uses the secret_store_libsecret
      ADBX_SECRET_STORE_CONTRACT_BACKEND: libsecret
      # In this headless container we force the session collection because the
      # default login keyring may require a GUI prompter. The real libsecret
      # integration path is exercised on our Linux laptop.
      ADBX_LIBSECRET_COLLECTION: session
    # PIE_LDFLAGS needed for Debian’s default PIE toolchain
    command:
        [
          "sh",
          "-lc",
          "set -e; dbus-run-session -- sh -lc 'eval \"$(gnome-keyring-daemon --unlock --components=secrets)\"; make clean; make build/tests/unit/test_secret_store_contract PIE_LDFLAGS=-no-pie -j4; ./build/tests/unit/test_secret_store_contract'"
        ]
